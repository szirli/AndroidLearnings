<app-header></app-header>
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user [user]="user" (selectedUserEmitter)="onSelectUser($event)" [selected]="selectedUserId===user.id"></app-user>
      </li>
    }
  </ul>
  @if (selectedUser) {
    <app-tasks [name]="selectedUser" [userId]="selectedUserId"></app-tasks>
  }
  @else {
    <p id="fallback">Select a user to see their tasks</p>
  }
</main>
