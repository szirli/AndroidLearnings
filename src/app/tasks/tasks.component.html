@if (isAddingTask) {
    <!-- <app-new-task (cancelledEventEmitter)="onCancelAddTask()" (addTaskEmitter)="onAddTask($event)" [userId]="userId"></app-new-task> -->
    <app-new-task (closeEventEmitter)="onCloseAddTask()"  [userId]="userId"></app-new-task>
}
<section id="tasks">
    <header>
        <h2>{{ name }}'s tasks</h2>
        <menu>
            <button (click)="onStartAddTask()"> Add Tasks</button>
        </menu>
    </header>
<ul>
    @for (task of selectedUserTasks; track task.id) {
        <li>
            <!-- <app-task [task]="task" (completeTaskEmitter)="onTaskComplete($event)"></app-task> -->
            <app-task [task]="task"></app-task>
        </li>
    }
</ul>
 
</section>
